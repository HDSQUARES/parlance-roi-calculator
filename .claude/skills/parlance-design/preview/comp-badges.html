<!DOCTYPE html>
<!-- @dsCard group="Components" name="Badges & pills" subtitle="Trust badges, filter pills, award/recognition" viewport="700x270" --><html lang="en"><head><meta charset="utf-8"><title>Badges & pills</title><style>@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Open+Sans:wght@400;600;700&display=swap');*{box-sizing:border-box}html,body{margin:0}body{font-family:'Open Sans',system-ui,sans-serif;background:#fff;padding:22px 24px;-webkit-font-smoothing:antialiased;color:#15233D}
.col{display:flex;flex-direction:column;gap:16px;max-width:660px;margin:0 auto}
.lbl{font-family:'Poppins',sans-serif;font-weight:600;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:#6B7888;margin-bottom:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:700;font-family:'Poppins',sans-serif}
.b-hipaa{background:#E9F6F5;color:#1F7E96}
.b-new{background:#F8C830;color:#0E1A38}
.b-soc{background:#EEF3F9;color:#43536B}
.b-live{background:#0E1A38;color:#fff}
.b-success{background:rgba(31,157,99,.12);color:#1f9d63}
.dot{width:7px;height:7px;border-radius:50%}
.pulse{animation:pd 1.3s ease-in-out infinite}@keyframes pd{0%,100%{opacity:1}50%{opacity:.35}}
.pill{display:inline-flex;align-items:center;gap:7px;border:1.5px solid #E2E8F0;border-radius:999px;padding:8px 15px;font-size:13px;font-weight:600;color:#43536B;background:#fff;cursor:pointer;white-space:nowrap}
.pill.active{background:#0E1A38;color:#fff;border-color:#0E1A38}
.award{display:inline-flex;align-items:center;gap:9px;border:1px solid #E2E8F0;border-radius:12px;padding:9px 15px;background:#fff;box-shadow:0 2px 8px rgba(14,26,56,.05)}
.award .ico{width:30px;height:30px;border-radius:8px;background:#F8C830;display:flex;align-items:center;justify-content:center}
.award .t{font-family:'Poppins',sans-serif;font-weight:700;font-size:12px;color:#15233D;display:block}
.award .s{font-size:10.5px;color:#6B7888;display:block}
</style></head><body>
<div class="col">
  <div><div class="lbl">Status & trust badges</div><div class="row">
    <span class="badge b-hipaa"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#1F7E96" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1Z"/></svg>HIPAA-compliant</span>
    <span class="badge b-new">New</span>
    <span class="badge b-soc">SOC 2 Type II</span>
    <span class="badge b-live"><span class="dot pulse" style="background:#3FCB8E"></span>Live</span>
    <span class="badge b-success"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#1f9d63" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>Resolved</span>
  </div></div>
  <div><div class="lbl">Category pills (filter / toggle)</div><div class="row">
    <span class="pill active">All</span><span class="pill">Switchboard</span><span class="pill">Contact Center</span><span class="pill">Clinics</span><span class="pill">Integrations</span>
  </div></div>
  <div><div class="lbl">Award / recognition</div><div class="row">
    <span class="award"><span class="ico"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6"/><path d="M8.5 13.5 7 22l5-3 5 3-1.5-8.5"/></svg></span><span><span class="t">Excellence Award</span><span class="s">Voice Customer 2022</span></span></span>
    <span class="award"><span class="ico" style="background:#2E92AB"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1Z"/><path d="m9 12 2 2 4-4"/></svg></span><span><span class="t">HIPAA Verified</span><span class="s">Compliance Times</span></span></span>
  </div></div>
</div></body></html>
