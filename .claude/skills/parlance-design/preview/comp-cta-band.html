<!DOCTYPE html>
<!-- @dsCard group="Components" name="CTA band" subtitle="Gradient closing band with dual CTAs" viewport="700x200" --><html lang="en"><head><meta charset="utf-8"><title>CTA band</title><style>@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Open+Sans:wght@400;600;700&display=swap');*{box-sizing:border-box}html,body{margin:0}body{font-family:'Open Sans',system-ui,sans-serif;background:#fff;-webkit-font-smoothing:antialiased;color:#15233D}
.band{background:linear-gradient(105deg,#0E1A38 0%,#122249 42%,#2E6FD0 100%);color:#fff;border-radius:20px;padding:34px 38px;display:flex;align-items:center;justify-content:space-between;gap:26px;flex-wrap:wrap;max-width:680px;margin:22px auto}
.band h2{font-family:'Poppins',sans-serif;font-weight:700;font-size:27px;margin:0;line-height:1.15}
.band .eg{font-family:'Poppins',sans-serif;font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#F8C830;margin-bottom:8px}
.btns{display:flex;gap:13px;flex-wrap:wrap}
.btn{font-family:'Poppins',sans-serif;font-weight:600;font-size:15px;border-radius:9px;padding:14px 24px;border:0;cursor:pointer}
.btn-y{background:#F8C830;color:#0E1A38}
.btn-o{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.55)}
</style></head><body>
<div class="band">
  <div><div class="eg">Get started</div><h2>A better way to handle patient calls</h2></div>
  <div class="btns"><button class="btn btn-y">Schedule a Live Demo</button><button class="btn btn-o">Talk to an Expert</button></div>
</div></body></html>
