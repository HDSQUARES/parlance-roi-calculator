<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Hero composite" subtitle="Circular portrait + bubbles popping in" viewport="700x420" --><html lang="en"><head><meta charset="utf-8"><title>Hero composite</title>
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="card.css">
<style>
.stage{position:relative;width:660px;height:380px;margin:0 auto}
.circle{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:300px;height:300px;border-radius:50%;overflow:hidden;box-shadow:var(--sh-md);background:var(--teal)}
.circle img{width:100%;height:100%;object-fit:cover}
.hb{position:absolute;color:#fff;border-radius:14px;padding:9px 14px;box-shadow:var(--sh-bubble);font-size:13.5px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;
   opacity:0;transform:translateY(10px) scale(.9);animation:pop 6.5s var(--ease) infinite;animation-delay:var(--d)}
.navy{background:var(--navy-700)}.teal{background:var(--teal-bubble)}
.yellow{background:var(--parlance-yellow)}
.bars{display:flex;align-items:center;gap:3px;height:20px}
.bars span{animation:eq 1s ease-in-out infinite}
@keyframes eq{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}
@keyframes pop{0%{opacity:0;transform:translateY(10px) scale(.9)}5%{opacity:1;transform:translateY(0) scale(1)}88%{opacity:1;transform:translateY(0) scale(1)}96%{opacity:0;transform:translateY(-7px) scale(.97)}100%{opacity:0}}
</style></head><body>
<div class="stage">
  <div class="circle"><img src="../assets/hero-portrait.png" alt="Patient using Parlance voice AI"></div>
  <div class="hb navy" style="top:38px;right:14px;--d:-2.6s"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92Z"/></svg><span>Call to General Hospital</span></div>
  <div class="hb teal" style="top:150px;left:6px;--d:-1.95s"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>Chat with AI Voice Agent</span></div>
  <div class="hb yellow" style="top:188px;right:30px;--d:-1.3s"><svg viewBox="0 0 24 24" width="15" height="15" fill="var(--navy-900)" stroke="none"><polygon points="6 4 20 12 6 20 6 4"/></svg><div class="bars"><span style="width:3px;border-radius:2px;background:var(--navy-900);height:6px"></span><span style="width:3px;border-radius:2px;background:var(--navy-900);height:17px"></span><span style="width:3px;border-radius:2px;background:var(--navy-900);height:20px"></span><span style="width:3px;border-radius:2px;background:var(--navy-900);height:12px"></span><span style="width:3px;border-radius:2px;background:var(--navy-900);height:12px"></span><span style="width:3px;border-radius:2px;background:var(--navy-900);height:20px"></span><span style="width:3px;border-radius:2px;background:var(--navy-900);height:17px"></span><span style="width:3px;border-radius:2px;background:var(--navy-900);height:6px"></span><span style="width:3px;border-radius:2px;background:var(--navy-900);height:17px"></span><span style="width:3px;border-radius:2px;background:var(--navy-900);height:20px"></span><span style="width:3px;border-radius:2px;background:var(--navy-900);height:12px"></span><span style="width:3px;border-radius:2px;background:var(--navy-900);height:12px"></span><span style="width:3px;border-radius:2px;background:var(--navy-900);height:20px"></span><span style="width:3px;border-radius:2px;background:var(--navy-900);height:17px"></span><span style="width:3px;border-radius:2px;background:var(--navy-900);height:6px"></span><span style="width:3px;border-radius:2px;background:var(--navy-900);height:17px"></span><span style="width:3px;border-radius:2px;background:var(--navy-900);height:20px"></span><span style="width:3px;border-radius:2px;background:var(--navy-900);height:12px"></span></div></div>
  <div class="hb teal" style="bottom:30px;left:54px;--d:-0.65s"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M9.5 9a2.5 2.5 0 1 1 3 2.5c-.5.2-1 .7-1 1.5"/><line x1="11.5" y1="16" x2="11.5" y2="16"/></svg><span>Get answers to common questions</span></div>
</div>
</body></html>
