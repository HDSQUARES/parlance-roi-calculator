<!DOCTYPE html>
<!-- @dsCard group="Components" name="Voice & chat bubbles" subtitle="Looping conversation — bubbles pop in one by one" viewport="700x330" --><html lang="en"><head><meta charset="utf-8"><title>Voice & chat bubbles</title>
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="card.css">
<style>
.convo{display:flex;flex-direction:column;gap:11px;align-items:stretch;max-width:560px}
.brow{display:flex;align-items:flex-end;gap:9px;opacity:0;transform-origin:left center}
.brow.right{flex-direction:row-reverse;transform-origin:right center}
.chip{width:30px;height:30px;border-radius:50%;background:var(--navy-900);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.bub{color:#fff;border-radius:14px;padding:10px 15px;box-shadow:var(--sh-bubble);font-size:14.5px;max-width:80%}
.bub .ey{font-family:var(--font-display);font-weight:700;font-size:9.5px;letter-spacing:.1em;opacity:.7;display:block;margin-bottom:1px}
.navy{background:var(--navy-700)}.teal{background:var(--teal-bubble);display:flex;align-items:center;gap:8px}
.yellow{background:var(--parlance-yellow);display:inline-flex;align-items:center;gap:11px}
.bars{display:flex;align-items:center;gap:3px;height:22px}
.bars span{animation:eq 1s ease-in-out infinite}
@keyframes eq{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}
@keyframes pop1{0%{opacity:0;transform:translateY(12px) scale(.94)}2%{opacity:0;transform:translateY(12px) scale(.94)}6%{opacity:1;transform:none}82%{opacity:1;transform:none}88%{opacity:0;transform:translateY(-8px) scale(.97)}100%{opacity:0;transform:translateY(-8px) scale(.97)}}
@keyframes pop2{0%{opacity:0;transform:translateY(12px) scale(.94)}12%{opacity:0;transform:translateY(12px) scale(.94)}16%{opacity:1;transform:none}82%{opacity:1;transform:none}88%{opacity:0;transform:translateY(-8px) scale(.97)}100%{opacity:0;transform:translateY(-8px) scale(.97)}}
@keyframes pop3{0%{opacity:0;transform:translateY(12px) scale(.94)}22%{opacity:0;transform:translateY(12px) scale(.94)}26%{opacity:1;transform:none}82%{opacity:1;transform:none}88%{opacity:0;transform:translateY(-8px) scale(.97)}100%{opacity:0;transform:translateY(-8px) scale(.97)}}
@keyframes pop4{0%{opacity:0;transform:translateY(12px) scale(.94)}32%{opacity:0;transform:translateY(12px) scale(.94)}36%{opacity:1;transform:none}82%{opacity:1;transform:none}88%{opacity:0;transform:translateY(-8px) scale(.97)}100%{opacity:0;transform:translateY(-8px) scale(.97)}}
@keyframes pop5{0%{opacity:0;transform:translateY(12px) scale(.94)}42%{opacity:0;transform:translateY(12px) scale(.94)}46%{opacity:1;transform:none}82%{opacity:1;transform:none}88%{opacity:0;transform:translateY(-8px) scale(.97)}100%{opacity:0;transform:translateY(-8px) scale(.97)}}
.b1{animation:pop1 9s var(--ease) infinite}.b2{animation:pop2 9s var(--ease) infinite}.b3{animation:pop3 9s var(--ease) infinite}.b4{animation:pop4 9s var(--ease) infinite}.b5{animation:pop5 9s var(--ease) infinite}
</style></head><body>
<div class="convo">
  <div class="brow  b1"><span class="chip"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92Z"/></svg></span><div class="bub navy"><span class="ey">JAMES CALLING</span>Can I speak with Dr. Lopez?</div></div>
  <div class="brow right b2"><div class="bub teal"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="12" rx="3"/><path d="M12 8V4M8 2h8"/><circle cx="9" cy="14" r="1.2" fill="#fff" stroke="none"/><circle cx="15" cy="14" r="1.2" fill="#fff" stroke="none"/></svg><span><span class="ey">PARLANCE AI</span>Of course — what's it regarding?</span></div></div>
  <div class="brow  b3"><span class="chip"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92Z"/></svg></span><div class="bub navy"><span class="ey">JAMES CALLING</span>It's about my test results</div></div>
  <div class="brow right b4"><div class="bub teal"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg><span>Connecting you to Cardiology</span></div></div>
  <div class="brow  b5"><span class="chip"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92Z"/></svg></span><div class="bub navy">Great, thank you!</div></div>
</div>
</body></html>
