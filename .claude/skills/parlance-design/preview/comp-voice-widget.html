<style>@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Open+Sans:wght@400;600;700&display=swap');*{box-sizing:border-box}html,body{margin:0}body{font-family:'Open Sans',system-ui,sans-serif;background:#fff;padding:22px 24px;-webkit-font-smoothing:antialiased}
.list{display:flex;flex-direction:column;gap:12px;max-width:660px;margin:0 auto}
.route{display:grid;grid-template-columns:1fr 34px minmax(196px,auto);align-items:center;gap:12px}
.said{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid #E2E8F0;border-radius:14px;padding:10px 13px;box-shadow:0 2px 6px rgba(14,26,56,.05)}
.said .chip{width:30px;height:30px;border-radius:50%;background:#0E1A38;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.said .txt{font-size:14px;color:#15233D;font-weight:600;flex:1}
.mw{display:inline-flex;align-items:center;gap:2px;height:16px;flex-shrink:0}
.mw span{width:2.5px;border-radius:2px;background:#2E92AB;animation:eq 1s ease-in-out infinite}
@keyframes eq{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
.arrow{display:flex;align-items:center;justify-content:center;animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(0);opacity:.5}50%{transform:translateX(4px);opacity:1}}
.dest{display:flex;align-items:center;gap:9px;border-radius:14px;padding:11px 15px;color:#fff;box-shadow:0 6px 16px rgba(14,26,56,.12)}
.dest .di{display:flex;flex-shrink:0;opacity:.95}
.dest .dn{font-family:'Poppins',sans-serif;font-weight:600;font-size:13.5px;white-space:nowrap}
