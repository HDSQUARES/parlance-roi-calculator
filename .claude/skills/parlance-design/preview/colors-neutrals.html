<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Neutral scale" subtitle="Ink, lines, white" viewport="700x150" --><html lang="en"><head><meta charset="utf-8"><title>Neutrals</title><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="card.css"></head><body>
<div class="row">
  <div class="col" style="flex:1"><div class="swatch" style="background:var(--ink)"></div><div class="sw-name">Ink</div><div class="sw-hex">#15233D</div></div>
  <div class="col" style="flex:1"><div class="swatch" style="background:var(--ink-2)"></div><div class="sw-name">Ink 2</div><div class="sw-hex">#43536B</div></div>
  <div class="col" style="flex:1"><div class="swatch" style="background:var(--ink-3)"></div><div class="sw-name">Ink 3</div><div class="sw-hex">#6B7888</div></div>
  <div class="col" style="flex:1"><div class="swatch" style="background:var(--line)"></div><div class="sw-name">Line</div><div class="sw-hex">#E2E8F0</div></div>
  <div class="col" style="flex:1"><div class="swatch" style="background:var(--white);border:1px solid var(--line)"></div><div class="sw-name">White</div><div class="sw-hex">#FFFFFF</div></div>
