<!DOCTYPE html>
<!-- @dsCard group="Components" name="Integrations & partners" subtitle="EHR (Cerner, athenahealth, MEDITECH) + telephony (Cisco, Avaya, Mitel) — real logos" viewport="700x260" --><html lang="en"><head><meta charset="utf-8"><title>Integrations & partners</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Open+Sans:wght@400;600;700&display=swap');*{box-sizing:border-box}html,body{margin:0}body{font-family:'Open Sans',system-ui,sans-serif;background:#fff;padding:22px 24px;-webkit-font-smoothing:antialiased}
.col{display:flex;flex-direction:column;gap:18px;max-width:700px;margin:0 auto}
.lbl{font-family:'Poppins',sans-serif;font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#6B7888;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.lbl::after{content:'';flex:1;height:1px;background:#E2E8F0}
.lbl .pin{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.chip{height:72px;border-radius:14px;display:flex;align-items:center;justify-content:center;padding:0 18px;transition:transform .2s,box-shadow .2s;overflow:hidden}
.chip:hover{transform:translateY(-3px)}
.chip.light{background:#fff;border:1px solid #E2E8F0;box-shadow:0 2px 10px rgba(14,26,56,.06)}
.chip.light:hover{box-shadow:0 12px 28px rgba(14,26,56,.12)}
.chip.light img{max-height:34px;max-width:140px;object-fit:contain}
.chip.dark{background:#000;border:1px solid rgba(255,255,255,.08);box-shadow:0 4px 14px rgba(14,26,56,.18)}
.chip.dark:hover{box-shadow:0 14px 30px rgba(14,26,56,.28)}
.chip.dark img{max-height:62px;max-width:100%;object-fit:contain}
</style></head><body>
<div class="col">
  <div>
    <div class="lbl"><span class="pin" style="background:#2E92AB"></span>EHR &amp; scheduling integrations</div>
    <div class="chips"><div class="chip light"><img src="../assets/integrations/cerner.png" alt="cerner"></div><div class="chip light"><img src="../assets/integrations/athenahealth.png" alt="athenahealth"></div><div class="chip light"><img src="../assets/integrations/meditech.png" alt="meditech"></div></div>
  </div>
  <div>
    <div class="lbl"><span class="pin" style="background:#F8C830"></span>Telephony platforms</div>
    <div class="chips"><div class="chip dark"><img src="../assets/integrations/cisco.png" alt="cisco"></div><div class="chip dark"><img src="../assets/integrations/avaya.png" alt="avaya"></div><div class="chip dark"><img src="../assets/integrations/mitel.png" alt="mitel"></div></div>
  </div>
</div>
</body></html>
