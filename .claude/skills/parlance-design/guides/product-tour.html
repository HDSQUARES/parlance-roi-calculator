<!DOCTYPE html>
<!-- @dsCard group="Components" name="Product Tour" subtitle="5-step interactive walkthrough of a call: answer → understand → route → resolve → confirm" viewport="920x560" -->
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parlance — How a Call Works</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Open+Sans:wght@400;600;700&display=swap');
:root{--yellow:#F8C830;--teal:#40A0B8;--teal6:#2E92AB;--teal7:#1F7E96;--navy:#0E1A38;--navy8:#122249;--royal:#2E6FD0;--ink:#15233D;--ink2:#43536B;--ink3:#6B7888;--line:#E2E8F0;--mint:#E9F6F5;--grey:#F5F8FB;--green:#1f9d63}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:'Open Sans',system-ui,sans-serif;background:var(--grey);color:var(--ink);-webkit-font-smoothing:antialiased;padding:36px 20px;min-height:100vh}
.shell{max-width:920px;margin:0 auto}
.top{display:flex;align-items:center;gap:12px;margin-bottom:8px}.top img{height:24px}
.eyebrow{font-family:'Poppins',sans-serif;font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal6)}
h1{font-family:'Poppins',sans-serif;font-weight:700;font-size:30px;margin:6px 0 22px;letter-spacing:-.01em}
.grid{display:grid;grid-template-columns:300px 1fr;gap:36px;align-items:center}
@media(max-width:740px){.grid{grid-template-columns:1fr;justify-items:center}}

/* phone */
.phone{width:280px;height:420px;background:var(--navy);border-radius:38px;padding:10px;box-shadow:0 22px 50px rgba(14,26,56,.28);position:relative;flex-shrink:0}
.notch{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:84px;height:22px;background:#000;border-radius:16px;z-index:9}
.screen{width:100%;height:100%;border-radius:30px;overflow:hidden;background:linear-gradient(170deg,#102149,#0E1A38 60%,#16335f);color:#fff;display:flex;flex-direction:column;align-items:center;padding:46px 20px 22px;position:relative}
.avatar{width:74px;height:74px;border-radius:50%;background:var(--teal);display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0}
.avatar .rg{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(64,160,184,.55);animation:rng 2s ease-out infinite}
@keyframes rng{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.7);opacity:0}}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.who{font-family:'Poppins',sans-serif;font-weight:700;font-size:17px;margin-top:12px}
.statelbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.6;margin-top:4px}
.scrn-bubble{margin-top:20px;width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:12px 14px;font-size:13.5px;line-height:1.45;min-height:74px;display:flex;align-items:center}
.scrn-bubble b{color:var(--yellow)}
.pillrow{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pill{background:rgba(255,255,255,.12);border-radius:999px;padding:6px 12px;font-size:11.5px;font-weight:600}
.pill.hot{background:var(--yellow);color:var(--navy)}
.checkbig{width:60px;height:60px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;margin-top:6px}

/* narration */
.steps{max-width:440px}
.stepnum{font-family:'Poppins',sans-serif;font-weight:700;font-size:13px;color:var(--teal6);letter-spacing:.04em}
.steptitle{font-family:'Poppins',sans-serif;font-weight:700;font-size:26px;line-height:1.15;margin:8px 0 12px}
.stepdesc{font-size:16px;line-height:1.6;color:var(--ink2);min-height:78px}
.dots{display:flex;gap:8px;margin:24px 0}
.dots span{width:9px;height:9px;border-radius:50%;background:var(--line);transition:all .2s;cursor:pointer}
.dots span.on{background:var(--teal6);width:26px;border-radius:5px}
.nav{display:flex;gap:12px;align-items:center}
.btn{font-family:'Poppins',sans-serif;font-weight:600;font-size:15px;border-radius:10px;padding:13px 24px;border:0;cursor:pointer}
.btn-p{background:var(--teal6);color:#fff}
.btn-o{background:#fff;border:1.5px solid #C7D0DC;color:var(--ink)}
.btn-o:disabled{opacity:.4;cursor:default}
</style>
</head>
<body>
<div class="shell">
  <div class="top"><img src="../assets/logo-parlance.png" alt="Parlance"></div>
  <div class="eyebrow">Product Tour</div>
  <h1>How Parlance handles a call</h1>
  <div class="grid">
    <div class="phone"><div class="notch"></div><div class="screen" id="screen"></div></div>
    <div class="steps">
      <div class="stepnum" id="snum">Step 1 of 5</div>
      <div class="steptitle" id="stitle"></div>
      <div class="stepdesc" id="sdesc"></div>
      <div class="dots" id="dots"></div>
      <div class="nav"><button class="btn btn-o" id="prev">← Back</button><button class="btn btn-p" id="nextb">Next →</button></div>
    </div>
  </div>
</div>
<script>
(function(){
  var bot='<svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="12" rx="3"/><path d="M12 8V4M8 2h8"/><circle cx="9" cy="14" r="1.2" fill="#fff" stroke="none"/><circle cx="15" cy="14" r="1.2" fill="#fff" stroke="none"/></svg>';
  var phoneIc='<svg viewBox="0 0 24 24" width="30" height="30" fill="#fff" stroke="none"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1 11.4 11.4 0 0 0 .57 3.6 1 1 0 0 1-.25 1Z"/></svg>';
  var check='<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
  var STEPS=[
    {t:"A patient calls in",d:"No menus, no \u201cpress 1.\u201d Parlance answers instantly, 24/7 \u2014 every call, no hold times.",
     screen:'<div class="avatar"><span class="rg"></span>'+phoneIc+'</div><div class="who">Incoming call</div><div class="statelbl">General Hospital</div><div class="scrn-bubble">\u201cHi, I need to follow up with cardiology about my test results.\u201d</div>'},
    {t:"It understands the request",d:"Proprietary name recognition picks up physician names, departments, and clinical terms from natural speech \u2014 even hard-to-pronounce names.",
     screen:'<div class="avatar"><span class="rg"></span>'+bot+'</div><div class="who">Parlance AI</div><div class="statelbl">Listening</div><div class="scrn-bubble">Understood: <b>Cardiology</b> \u00b7 follow-up \u00b7 existing patient</div><div class="pillrow"><span class="pill hot">Cardiology</span><span class="pill">Follow-up</span></div>'},
    {t:"It routes to the right place",d:"Connected to your scheduling and EHR over HL7, Parlance routes the caller to the correct team \u2014 the first time.",
     screen:'<div class="avatar"><span class="rg"></span>'+bot+'</div><div class="who">Routing</div><div class="statelbl">Connecting</div><div class="scrn-bubble">Connecting you to <b>Cardiology scheduling</b>\u2026</div><div class="pillrow"><span class="pill">Verified patient</span><span class="pill hot">\u2192 Cardiology</span></div>'},
    {t:"It resolves the call",d:"Routine requests \u2014 scheduling, refills, directions \u2014 are completed hands-free, so operators focus on calls that need a person.",
     screen:'<div class="checkbig">'+check+'</div><div class="who" style="margin-top:12px">Appointment booked</div><div class="statelbl">Thu \u00b7 9:30 AM \u00b7 Dr. Wang</div><div class="scrn-bubble">\u201cYou\u2019re all set for Thursday at 9:30 with Dr. Wang.\u201d</div>'},
    {t:"It confirms by text",d:"Beyond voice, Parlance sends a HIPAA-compliant SMS confirmation \u2014 giving patients another way to stay in the loop.",
     screen:'<div class="avatar" style="background:var(--green)">'+check+'</div><div class="who">Confirmed</div><div class="statelbl">SMS sent</div><div class="scrn-bubble">\ud83d\udcf2 Text sent: \u201cConfirmed: Cardiology, Thu 9:30 AM. Reply R to reschedule.\u201d</div>'}
  ];
  var i=0;
  var screen=document.getElementById('screen'),snum=document.getElementById('snum'),stitle=document.getElementById('stitle'),sdesc=document.getElementById('sdesc'),dots=document.getElementById('dots'),prev=document.getElementById('prev'),nextb=document.getElementById('nextb');
  STEPS.forEach(function(_,idx){var s=document.createElement('span');s.onclick=function(){i=idx;render();};dots.appendChild(s);});
  function render(){
    var S=STEPS[i];
    screen.innerHTML=S.screen;
    screen.style.animation='none'; void screen.offsetWidth; screen.style.animation='fadein .35s ease';
    snum.textContent='Step '+(i+1)+' of '+STEPS.length;
    stitle.textContent=S.t; sdesc.textContent=S.d;
    [].forEach.call(dots.children,function(d,idx){d.className=idx===i?'on':'';});
    prev.disabled=i===0;
    nextb.textContent=i===STEPS.length-1?'Restart ↻':'Next →';
  }
  screen.style.transition='';
  nextb.onclick=function(){ if(i<STEPS.length-1)i++; else i=0; render(); };
  prev.onclick=function(){ if(i>0){i--;render();} };
  render();
})();
</script>
</body>
</html>
